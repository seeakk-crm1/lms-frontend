server {
    listen 80;
    root /usr/share/nginx/html;

    # Public homepage
    location = / {
        try_files /index.html =404;
    }

    # Client-side SPA routes (keep in sync with src/App.tsx; checked by scripts/check-spa-routes.mjs)
    location ~ ^/(login|forgot-password|reset-password|invite|activate-account|workspace|dashboard|admin|unlock-staff|salary|settings|leads|calendar|reports|attendance|location-tracker|lob-analysis|sheets|master|privacy-policy|terms|data-deletion)(/.*)?$ {
        try_files $uri /index.html;
    }

    # Static files; anything else is a real 404
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
